name: Update official stock data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: stock-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official daily data
        run: |
          python - <<'PY'
          import datetime, json, os, subprocess
          from pathlib import Path
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          stocks = json.loads(Path('data/stocks.json').read_text()).get('stocks', [])
          if not stocks or os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' or (now.weekday() < 5 and now.hour == 18):
              subprocess.run(['python', 'scripts/update_data.py'], check=True)
          PY
      - name: Sync industries and public references
        run: python scripts/sync_sources.py
      - name: Commit data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stocks.json data/themes.json data/themes-v2.json data/history
          if ! git diff --cached --quiet; then
            git commit -m 'Update official daily stock data'
            git push
          fi
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - name: Prepare public files
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/site
          cp index.html /tmp/site/
          cp -r data /tmp/site/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: /tmp/site
      - uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'
        id: deployment
